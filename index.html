* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --green-900: #0f2e1f;
  --green-800: #0c2a1e;
  --green-700: #0a4d2e;
  --green-600: #0f7a4a;
  --yellow: #fbbf24;
  --red: #c1352a;
  --bg-light: #f8faf9;
  --text: #1a1a1a;
  --muted: #6b7d73;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
  background: #fff;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
a { text-decoration:none; color:inherit; }

/* Topbar */
.topbar { background: var(--green-900); color:#fff; font-size:12px; }
.topbar .container { height:36px; display:flex; align-items:center; justify-content:space-between; }

/* Header */
.header { background:#fff; border-bottom:1px solid rgba(0,0,0,.06); position:sticky; top:0; z-index:20; }
.header-inner { height:72px; display:flex; align-items:center; justify-content:space-between; }
.brand { display:flex; align-items:center; gap:12px; }
.logo { width:44px; height:44px; border-radius:50%; background:var(--green-600); display:grid; place-items:center; color:#fff; font-size:20px; }
.brand-title { font-weight:800; font-size:15px; color:var(--green-900); letter-spacing:.02em; line-height:1.1; }
.brand-sub { font-size:12px; color:#5a6b60; font-weight:500; }
.nav { display:flex; gap:32px; font-size:14px; font-weight:600; color:#2a3a30; }
.nav a.active { color:var(--green-900); position:relative; }
.nav a.active::after { content:""; position:absolute; left:0; bottom:-8px; width:100%; height:3px; background:var(--yellow); border-radius:999px; }

/* Auth bar */
.authbar { display:flex; height:46px; font-size:13px; font-weight:800; letter-spacing:.08em; }
.auth-login { flex:1; background:var(--yellow); color:var(--green-900); display:grid; place-items:center; }
.auth-daftar { flex:1; background: linear-gradient(90deg, #123b28, #0f2e1f); color:#fff; display:grid; place-items:center; }

/* Hero */
.hero {
  background: linear-gradient(135deg, #0f7a4a 0%, #0a4d2e 100%);
  text-align:center; padding:88px 24px; color:#fff; position:relative;
}
.pill { display:inline-block; background:#c1352a; color:#fff; font-size:10px; font-weight:800; letter-spacing:.14em; padding:6px 14px; border-radius:999px; margin-bottom:28px; }
.hero h1 { font-size:64px; font-weight:800; letter-spacing:-.02em; line-height:.95; margin-bottom:12px; }
.hero-title { font-size:15px; opacity:.9; font-weight:500; }
.hero-desc { font-size:14px; opacity:.7; max-width:520px; margin:6px auto 0; }
.btn-yellow { display:inline-flex; margin-top:28px; background:var(--yellow); color:var(--green-900); font-size:13px; font-weight:800; padding:12px 24px; border-radius:999px; box-shadow:0 8px 20px rgba(251,191,36,.3); }

/* Statistik */
.statistik { background: var(--green-800); padding:44px 0; }
.stat-grid { display:grid; grid-template-columns: repeat(4,1fr); gap:16px; }
.stat-card { border:1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); border-radius:14px; padding:28px 20px; text-align:center; backdrop-filter: blur(6px); }
.stat-num { color:var(--yellow); font-size:36px; font-weight:800; line-height:1; }
.stat-label { color:rgba(255,255,255,.7); font-size:13px; margin-top:8px; }

/* Layanan */
.layanan { background: var(--bg-light); padding:56px 0 24px; }
.section-title { text-align:center; font-size:26px; font-weight:800; color:var(--green-900); letter-spacing:-.01em; }
.section-sub { text-align:center; font-size:13px; color:var(--muted); margin-top:8px; margin-bottom:32px; }
.layanan-grid { display:grid; grid-template-columns: repeat(4,1fr); gap:20px; }
.card { background:#fff; border:1px solid rgba(0,0,0,.06); border-radius:16px; padding:20px; transition: .2s; }
.card:hover { transform: translateY(-2px); box-shadow:0 8px 24px rgba(15,46,31,.08); }
.icon { width:44px; height:44px; border-radius:50%; background:#e8f5ef; display:grid; place-items:center; font-size:18px; margin-bottom:16px; }
.card-title { font-weight:700; font-size:14px; color:var(--green-900); }
.card-desc { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5; }

/* Berita */
.berita { background: var(--bg-light); padding:32px 0 64px; }
.berita-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.berita-head h2 { font-size:22px; font-weight:800; color:var(--green-900); }
.berita-head a { font-size:12px; font-weight:700; color:var(--green-600); }
.berita-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:20px; }
.berita-card { background:#fff; border:1px solid rgba(0,0,0,.06); border-radius:16px; padding:24px; display:flex; flex-direction:column; }
.berita-date { font-size:11px; font-weight:800; color:var(--red); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px; }
.berita-title { font-size:15px; font-weight:700; color:var(--green-900); line-height:1.35; }
.berita-desc { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.6; flex:1; }
.berita-link { margin-top:16px; font-size:12px; font-weight:700; color:var(--green-600); }

/* Footer */
.footer { background:#0a241a; color:rgba(255,255,255,.6); }
.footer-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:32px; padding:48px 24px; }
.footer-brand { font-weight:800; color:#fff; display:flex; gap:10px; line-height:1.1; margin-bottom:12px; }
.footer h4 { color:#fff; font-size:13px; margin-bottom:12px; }
.footer p { font-size:12px; line-height:1.8; }
.footer-bottom { border-top:1px solid rgba(255,255,255,.1); }
.bottom-inner { height:48px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:rgba(255,255,255,.5); }
.bottom-nav { display:flex; gap:16px; }

/* Responsive */
@media (max-width: 900px) {
  .stat-grid, .layanan-grid { grid-template-columns: repeat(2,1fr); }
  .berita-grid { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr; }
  .nav { display:none; }
  .hero h1 { font-size:44px; }
}
`,Em=`// js/main.js - dynamic rendering from JSON (replaces PHP)
document.addEventListener('DOMContentLoaded', async () => {
  try {
    // Statistik
    const statRes = await fetch('data/statistik.json');
    const stats = await statRes.json();
    const statGrid = document.getElementById('statistik-grid');
    if (statGrid) {
      statGrid.innerHTML = stats.map(s => \`
        <div class="stat-card">
          <div class="stat-num">\${s.angka}</div>
          <div class="stat-label">\${s.label}</div>
        </div>
      \`).join('');
    }

    // Layanan
    const layananRes = await fetch('data/layanan.json');
    const layanan = await layananRes.json();
    const layananGrid = document.getElementById('layanan-grid');
    if (layananGrid) {
      layananGrid.innerHTML = layanan.map(l => \`
        <div class="card">
          <div class="icon">\${l.icon}</div>
          <div class="card-title">\${l.title}</div>
          <div class="card-desc">\${l.desc}</div>
        </div>
      \`).join('');
    }

    // Berita
    const beritaRes = await fetch('data/berita.json');
    const berita = await beritaRes.json();
    const beritaGrid = document.getElementById('berita-grid');
    if (beritaGrid) {
      beritaGrid.innerHTML = berita.map(b => \`
        <div class="berita-card">
          <div class="berita-date">\${b.date}</div>
          <div class="berita-title">\${b.title}</div>
          <div class="berita-desc">\${b.desc}</div>
          <a class="berita-link" href="#">Baca selengkapnya →</a>
        </div>
      \`).join('');
    }
  } catch (e) {
    console.error('Failed to load JSON data', e);
  }
});

<!-- ❌ SEBELUM: -->
<div class="form-group">
    <label for="email" class="form-label">
        <i class="fas fa-envelope mr-2"></i>Email *
    </label>
    <input 
        type="email" 
        id="email" 
        name="email" 
        class="form-input" 
        placeholder="nama@guru.sd.belajar.id"
        required
        autocomplete="email"
    >
    <p class="form-hint">Gunakan email resmi guru (@guru.sd.belajar.id atau domain sekolah)</p>
    <p class="form-error" id="error-email"></p>
</div>

<!-- ✅ SESUDAH (Ganti hint + placeholder): -->
